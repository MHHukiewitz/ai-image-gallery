# Full main config, not a conf.d snippet. nginx's compiled-in pid path is /var/run/nginx.pid,
# which the nginx user cannot write, and `pid` is only valid in the main context.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The image is served from /, so no version or build string is needed in headers.
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Container logs. The nginx user cannot open files under /var/log/nginx.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Matches MAX_UPLOAD_MB (10) plus multipart overhead. The nginx default of 1m would
        # reject normal photo uploads with 413 before they reach the API.
        client_max_body_size 12m;

        # Vite names bundles by content hash, so they can be cached for a year. A missing
        # asset must return 404, not index.html, or the HTML would be cached as a script.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html names the hashed bundles, so it must always be revalidated. Unknown
        # paths fall back to it so client-side routes work on a reload.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # Docker's embedded DNS. Because proxy_pass uses a variable, nginx resolves `api` per
        # request instead of at startup, so the web container starts before the API does.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:8000;
            # A variable with no URI part passes the original request path through unchanged.
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
