name: CI

# This workflow is the merge gate for every PR. Jobs whose inputs are not in the tree yet are
# skipped, not failed, so the gate stays green while the tickets that add those inputs are open.

on:
  pull_request:
    # `labeled` is there so that adding the `e2e` label to an open PR starts the e2e job. The
    # other types are the defaults.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

# The built-in token only needs to read the code. No repository secrets are required.
permissions:
  contents: read

# A newer push to the same ref makes the run in progress obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reports which optional inputs exist. The jobs below read these outputs in their `if:`, so a
  # job whose inputs are missing is skipped as a whole, not run and failed.
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.inputs.outputs.contract }}
      pgtap: ${{ steps.inputs.outputs.pgtap }}
      api_integration: ${{ steps.inputs.outputs.api_integration }}
      docker: ${{ steps.inputs.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - id: inputs
        name: Check which optional inputs exist
        shell: bash
        run: |
          {
            echo "contract=$(test -f scripts/gen-api-types.sh && echo true || echo false)"
            echo "pgtap=$(compgen -G 'supabase/tests/*.sql' > /dev/null && echo true || echo false)"
            echo "api_integration=$(grep -rqs 'pytest.mark.integration' api/tests && echo true || echo false)"
            echo "docker=$(test -f api/Dockerfile && test -f web/Dockerfile && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Ruff check
        working-directory: api
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: api
        run: uv run ruff format --check .
      - name: Unit tests
        working-directory: api
        run: uv run pytest -m "not integration"

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The only values the browser bundle may receive. Both are public by design. These
      # placeholders keep the build away from any real project.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npm run typecheck
      - name: Format check
        working-directory: web
        run: npm run format:check
      - name: Unit tests
        working-directory: web
        run: npm run test -- --run
      - name: Build
        working-directory: web
        run: npm run build

  contract:
    needs: detect
    if: needs.detect.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install API dependencies
        working-directory: api
        run: uv sync --frozen
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Regenerate API types
        run: make types
      # Fails when the committed types no longer match the API's schemas.
      - name: Check for drift
        run: git diff --exit-code -- web/src/lib/api-types.ts

  db:
    needs: detect
    if: needs.detect.outputs.pgtap == 'true' || needs.detect.outputs.api_integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      # Start only what the tests reach: Auth, PostgREST, Storage and the Kong gateway in front
      # of them. The other services are excluded. Names are the ones `supabase start --help`
      # lists for 2.121.0 (inbucket is now mailpit).
      - name: Start the local stack
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,realtime,logflare,vector,supavisor,postgres-meta
      - name: pgTAP tests
        if: needs.detect.outputs.pgtap == 'true'
        run: supabase test db
      - name: Export local stack keys for the integration tests
        if: needs.detect.outputs.api_integration == 'true'
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            # Newer CLIs print PUBLISHABLE_KEY and SECRET_KEY. Older ones print the ANON and
            # SERVICE_ROLE names, so fall back to them.
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET}"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
        if: needs.detect.outputs.api_integration == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Integration tests
        if: needs.detect.outputs.api_integration == 'true'
        working-directory: api
        run: |
          uv sync --frozen
          uv run pytest -m integration

  docker:
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build only. Nothing is pushed, and the GHA cache keeps rebuilds of unchanged layers quick.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The full product against a real stack: Supabase, then the API, worker and web containers from
  # docker-compose.yml with the fake analyzer, driven by the Playwright suite in e2e/. It takes
  # minutes, so it runs on main and on PRs that carry the `e2e` label, not on every PR.
  e2e:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      # The same service list as the db job: only what the API and the browser reach.
      - name: Start the local Supabase stack
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,realtime,logflare,vector,supavisor,postgres-meta
      # Compose and the suite both read this file. The values belong to the throwaway stack on this
      # runner. compose overrides SUPABASE_URL for the containers, so the host keeps 127.0.0.1.
      - name: Write .env from the stack's keys
        run: |
          # Only the KEY=value lines: the CLI also prints a line about the services we skipped.
          supabase status -o env 2>/dev/null | grep -E '^[A-Z0-9_]+=' > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            # Newer CLIs print PUBLISHABLE_KEY and SECRET_KEY. Older ones print the ANON and
            # SERVICE_ROLE names, so fall back to them.
            echo "SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET}"
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "ANALYZER=fake"
          } > .env
      - name: Build and start the app
        run: docker compose up -d --build
      # Not `up --wait`: the worker has no health check, which `--wait` reports as an error. The
      # deep check also proves that the API container reaches Supabase.
      - name: Wait for the API
        run: curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors "http://localhost:8080/api/health?deep=1"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        working-directory: e2e
        run: npm ci
      - name: Type-check
        working-directory: e2e
        run: npm run typecheck
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run the suite
        working-directory: e2e
        run: npx playwright test
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Show the container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the whole history, not only the checked-out commit.
          fetch-depth: 0
      # Free for personal repositories. An organization needs a GITLEAKS_LICENSE secret added.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
