[project]
name = "gallery"
version = "0.1.0"
description = "AI Image Gallery: FastAPI API and analysis worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.155.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "supabase==2.33.0",
    "pyjwt[crypto]==2.15.1",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "anthropic==1.15.0",
    "openai==3.35.1",
    "sentry-sdk[fastapi]==2.73.0",
    "typesafe-sdk[pil]==0.7.5",
    "fastembed==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.17.1",
]

# fastembed 0.9.0 caps pillow below 13, but it only uses Pillow in its image-embedding classes.
# The worker embeds text, so the app keeps the Pillow it was built and tested on. Drop this
# override once fastembed lifts the cap.
[tool.uv]
override-dependencies = ["pillow==13.0.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallery"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs the local Supabase stack (`make dev-db`)",
]
